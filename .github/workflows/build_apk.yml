name: Build Diamond Quiz Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout user files
        uses: actions/checkout@v4
        with:
          path: user_src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create clean Flutter app & merge files
        run: |
          flutter create --org com.aistudio.diamondrewards --project-name diamond_quiz_app app_build
          cp user_src/pubspec.yaml app_build/pubspec.yaml
          cp user_src/lib/main.dart app_build/lib/main.dart
          if [ -f user_src/android/app/google-services.json ]; then
            cp user_src/android/app/google-services.json app_build/android/app/google-services.json
          fi

          python3 -c '
          p = "app_build/android/app/build.gradle.kts"
          s = open(p).read()
          s = s.replace("com.aistudio.diamondrewards.diamond_quiz_app", "com.aistudio.diamondrewards.kxmvpz")
          if "com.google.gms.google-services" not in s:
              s = s.replace("id(\"kotlin-android\")", "id(\"kotlin-android\")\n    id(\"com.google.gms.google-services\")")
          if "minSdk = flutter.minSdkVersion" in s:
              s = s.replace("minSdk = flutter.minSdkVersion", "minSdk = 23")
          open(p, "w").write(s)

          sp = "app_build/android/settings.gradle.kts"
          ss = open(sp).read()
          if "com.google.gms.google-services" not in ss:
              ss = ss.replace("id(\"org.jetbrains.kotlin.android\")", "id(\"com.google.gms.google-services\") version \"4.4.2\" apply false\n    id(\"org.jetbrains.kotlin.android\")")
          open(sp, "w").write(ss)

          mp = "app_build/android/app/src/main/AndroidManifest.xml"
          ms = open(mp).read()
          ms = ms.replace("android:label=\"diamond_quiz_app\"", "android:label=\"Diamond Quiz\"")
          ad_meta = """    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>\n    <application"""
          ms = ms.replace("    <application", ad_meta, 1)
          app_meta = """<meta-data\n            android:name="com.google.android.gms.ads.APPLICATION_ID"\n            android:value="ca-app-pub-3940256099942544~3347511713"/>"""
          ms = ms.replace("</application>", f"        {app_meta}\n    </application>", 1)
          open(mp, "w").write(ms)
          '

      - name: Install dependencies
        working-directory: app_build
        run: flutter pub get

      - name: Build Release APK
        working-directory: app_build
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diamond-Quiz-Release-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
